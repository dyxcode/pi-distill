<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="980" viewBox="0 0 1220 980" role="img" aria-labelledby="title description">
<title id="title">关闭 Pi，重新开始，让知识延续。</title>
<desc id="description">退出时记录任务，后续 Pi 提炼记忆、清理符合条件的历史，并检索记忆。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1220" height="980" rx="20" fill="#f6f8fb"/>
<text x="40" y="65" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#163c40" text-anchor="start">关闭 Pi，重新开始，让知识延续。</text>
<text x="40" y="108" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#465569" text-anchor="start">示例：最后一个 Pi 进程退出，之后启动新进程。</text>
<rect x="45" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="190" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">Pi 进程 A</text>
<line x1="190" y1="215" x2="190" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="465" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="610" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">本地队列与记忆</text>
<line x1="610" y1="215" x2="610" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="885" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="1030" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">下一次 Pi 进程</text>
<line x1="1030" y1="215" x2="1030" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<text x="190" y="250" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">对话 → Ctrl+D</text>
<polyline points="190,300 600,300" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="400" y="286" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">保存任务引用</text>
<text x="190" y="335" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#80512a" text-anchor="middle">进程退出</text>
<rect x="40" y="365" width="1140" height="55" rx="10" fill="#fff3e7"/>
<text x="610" y="400" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#80512a" text-anchor="middle">没有 Pi 运行：待办工作保留在磁盘。</text>
<text x="1030" y="460" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">运行 pi → 新 session</text>
<polyline points="1030,510 620,510" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="496" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">恢复并领取 distill 任务</text>
<rect x="855" y="545" width="335" height="85" rx="14" fill="#fff" stroke="#d9e1ec" stroke-width="1.5"/>
<text x="875" y="580" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#23354b" text-anchor="start">后台提炼</text>
<text x="875" y="610" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">前台模型工作空闲后进行</text>
<polyline points="1030,680 620,680" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="655" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">提交记忆与进度</text>
<text x="820" y="707" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="middle">处理完成后加入清理任务</text>
<rect x="855" y="735" width="335" height="85" rx="14" fill="#fff3e7" stroke="#e3c9aa" stroke-width="1.5"/>
<text x="875" y="770" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#80512a" text-anchor="start">本地清理</text>
<text x="875" y="800" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">检查并删除符合条件的源文件</text>
<polyline points="610,880 1020,880" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="864" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">通过搜索和读取找回记忆</text>
<text x="40" y="950" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">待办队列尚未完成时即可开始对话；新记忆提交后便可检索。</text>
</svg>
