<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="980" viewBox="0 0 1220 980" role="img" aria-labelledby="title description">
<title id="title">Close Pi. Start fresh. Carry knowledge forward.</title>
<desc id="description">Exit records a task. A later Pi distills, cleans eligible history, and retrieves memories.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1220" height="980" rx="20" fill="#f6f8fb"/>
<text x="40" y="65" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#163c40" text-anchor="start">Close Pi. Start fresh. Carry knowledge forward.</text>
<text x="40" y="108" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#465569" text-anchor="start">Example: the last Pi process exits, then a new process starts.</text>
<rect x="45" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="190" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">Pi process A</text>
<line x1="190" y1="215" x2="190" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="465" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="610" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">Local queues + memories</text>
<line x1="610" y1="215" x2="610" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="885" y="150" width="290" height="60" rx="12" fill="#e3f3ee" stroke="#9bcdbd"/>
<text x="1030" y="188" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#155f50" text-anchor="middle">Next Pi process</text>
<line x1="1030" y1="215" x2="1030" y2="910" stroke="#bdc9d6" stroke-width="2" stroke-dasharray="6 7"/>
<text x="190" y="250" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Conversation → Ctrl+D</text>
<polyline points="190,300 600,300" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="400" y="286" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Save task reference</text>
<text x="190" y="335" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#80512a" text-anchor="middle">Process exits</text>
<rect x="40" y="365" width="1140" height="55" rx="10" fill="#fff3e7"/>
<text x="610" y="400" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#80512a" text-anchor="middle">No Pi running: pending work remains on disk.</text>
<text x="1030" y="460" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Run pi → fresh session</text>
<polyline points="1030,510 620,510" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="496" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Recover and claim distill work</text>
<rect x="855" y="545" width="335" height="85" rx="14" fill="#fff" stroke="#d9e1ec" stroke-width="1.5"/>
<text x="875" y="580" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#23354b" text-anchor="start">Background distill</text>
<text x="875" y="610" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">When foreground work is idle</text>
<polyline points="1030,680 620,680" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="655" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Commit memories + progress</text>
<text x="820" y="707" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="middle">Queue cleanup on completion</text>
<rect x="855" y="735" width="335" height="85" rx="14" fill="#fff3e7" stroke="#e3c9aa" stroke-width="1.5"/>
<text x="875" y="770" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#80512a" text-anchor="start">Local cleanup</text>
<text x="875" y="800" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">Check, then delete eligible source</text>
<polyline points="610,880 1020,880" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="864" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#465569" text-anchor="middle">Recall through search and read</text>
<text x="40" y="950" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#465569" text-anchor="start">Conversation can begin before the backlog finishes; new memories become available after commit.</text>
</svg>
